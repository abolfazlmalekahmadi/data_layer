        - name: "Validate All CSVs"
          path_pattern: "**/*.csv"
          validator: "tabular"
          rules:
            dataset:
              chunksize: 10000 # Ensure huge file is chunked

        - name: "Validate All Parquet Files"
          path_pattern: "**/*.parquet"
          validator: "tabular"

        - name: "Validate JPG Images"
          path_pattern: "**/*.jpg"
          validator: "image"

        - name: "Validate PNG Images"
          path_pattern: "**/*.png"
          validator: "image"

        - name: "Validate JSON Files"
          path_pattern: "**/*.json
          validator: "json"

        - name: "Validate Audio Files"
          path_pattern: "**/*.wav"
          validator: "audio"

        - name: "Validate Audio Files(mp3)"
          path_pattern: "**/*.mp3"
          validator: "audio"        